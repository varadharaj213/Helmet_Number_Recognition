<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='student_registration.css') }}">
</head>
<body>
    <nav>
        <div class="logo">STUDENT REGISTRATION</div>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('admin_login') }}">Admin Login</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <h1>Student Registration</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="text" name="register_number" placeholder="Register Number" required>
            <input type="text" name="department" placeholder="Department" required>
            <input type="text" name="vehicle_number" placeholder="Vehicle Number" required>
            <input type="text" name="mobile_number" placeholder="Mobile Number" required>
            <input type="email" name="email" placeholder="Email" required>
            <button class="submit-btn" type="submit">Register</button>
        </form>
    </div>
    
    <footer>
        <p>&copy; 2024 My App. All Rights Reserved.</p>
    </footer>
</body>
</html>
